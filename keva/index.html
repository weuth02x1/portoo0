<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="domain-verification" content="24dae91c8720a3768ab11615be7cdc0c0a3c1d6c7e04323f1dde9afdd2d1e649">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVA — لوحة التحكم</title>
<link rel="icon" type="image/png" href="keva-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Cairo, system-ui, sans-serif;
    color: #1a1228;
    background: #f6f1fb;
  }
  .login-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .login-aurora {
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(42% 38% at 18% 22%, rgba(240, 84, 148, 0.28), transparent 62%),
      radial-gradient(38% 34% at 86% 18%, rgba(124, 58, 237, 0.22), transparent 60%),
      radial-gradient(46% 40% at 70% 88%, rgba(192, 38, 211, 0.16), transparent 64%);
    animation: loginAurora 16s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .login-card {
    width: min(1180px, 100%);
    min-height: calc(100vh - 48px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: rgba(255,255,255,.88);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 30px 80px rgba(112,41,138,.14), 0 8px 24px rgba(17,12,28,.06);
    animation: loginCardIn .7s cubic-bezier(.22,1,.36,1);
  }
  .login-form {
    padding: 3rem 3.2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-kicker {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    color: #c026d3;
    text-transform: uppercase;
    animation: loginFadeUp .6s both;
  }
  .login-form h2 { margin: 0 0 8px; font-size: 28px; color: #1e1b4b; animation: loginFadeUp .6s .06s both; }
  .sub { color: #9a8fa8; margin: 0 0 28px; animation: loginFadeUp .6s .12s both; }
  .field-label {
    display: flex; flex-direction: column; gap: 8px;
    font-weight: 700; font-size: 13px; margin-bottom: 14px;
    animation: loginFadeUp .6s .18s both;
  }
  .field-label:nth-of-type(2) { animation-delay: .24s; }
  .field-wrap { position: relative; display: block; }
  .input {
    width: 100%; height: 52px; border: 1px solid transparent; border-radius: 14px;
    padding: 0 16px; background: #faf8fc; font-size: 15px; font-family: inherit;
    box-shadow: 0 0 0 1px #eeeaf3;
    transition: box-shadow .22s ease, background .22s ease;
  }
  .input:focus {
    outline: none; background: #fff;
    box-shadow: 0 0 0 2px rgba(192,38,211,.28), 0 8px 20px rgba(112,41,138,.08);
  }
  .login-meta {
    display: flex; justify-content: space-between; align-items: center;
    color: #9a8fa8; font-size: 13px; margin: 4px 0 12px;
    animation: loginFadeUp .6s .3s both;
  }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .forgot { color: #c026d3; cursor: default; }
  .login-submit {
    height: 54px; border: 0; border-radius: 16px; color: #fff; font-family: inherit;
    font-weight: 800; cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(90deg, #f472b6 0%, #7c3aed 100%);
    background-size: 160% 100%;
    box-shadow: 0 10px 24px rgba(124,58,237,.28);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: loginFadeUp .6s .36s both;
  }
  .login-submit:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(124,58,237,.34); background-position: 100% 0; }
  .login-submit::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.38) 48%, transparent 66%);
    transform: translateX(120%);
    animation: loginShine 3.6s ease-in-out infinite;
  }
  .verify-seal {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center;
    margin: 4px 0 10px; padding: 12px 14px; border-radius: 16px;
    background: linear-gradient(#fff,#fff) padding-box, linear-gradient(120deg,#f05494,#7c3aed) border-box;
    border: 1.5px solid transparent; animation: loginFadeUp .6s .4s both;
  }
  .verify-stamp { color: #16a34a; font-size: 12px; font-weight: 800; }
  .verify-code {
    grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: #4c1d95;
    letter-spacing: .03em; word-break: break-all; direction: ltr; text-align: left;
  }
  .secure-note { text-align: center; color: #16a34a; font-size: 12px; margin-top: 18px; animation: loginFadeUp .6s .42s both; }
  .login-hero {
    background: linear-gradient(165deg, #f472b6 0%, #c026d3 38%, #7c3aed 100%);
    background-size: 160% 160%;
    animation: loginHeroShift 14s ease-in-out infinite alternate;
    color: #fff; padding: 3rem 2.5rem; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    position: relative; overflow: hidden;
  }
  .login-orbs span {
    position: absolute; border-radius: 50%; filter: blur(2px);
    background: rgba(255,255,255,.18); animation: loginOrb 9s ease-in-out infinite;
  }
  .login-orbs span:nth-child(1) { width: 180px; height: 180px; top: -40px; right: -30px; }
  .login-orbs span:nth-child(2) { width: 120px; height: 120px; bottom: 40px; left: -20px; animation-delay: -3s; }
  .login-orbs span:nth-child(3) { width: 70px; height: 70px; top: 38%; left: 28%; animation-delay: -5s; }
  .login-route {
    position: absolute; inset: 8% 6%; width: auto; height: auto; opacity: .28; pointer-events: none;
  }
  .login-route path {
    fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 8 10;
    animation: loginDash 18s linear infinite;
  }
  .login-packet {
    fill: #fff;
    offset-path: path("M40 80 C 90 140, 230 90, 270 180 S 80 280, 60 360");
    animation: loginPacket 5.5s ease-in-out infinite;
  }
  .login-mark {
    position: absolute; left: -40px; bottom: -70px; opacity: .16; color: #fff; pointer-events: none;
    animation: loginMark 12s ease-in-out infinite;
  }
  .app-icon {
    width: 92px; height: 92px; border-radius: 28px; margin-bottom: 22px;
    position: relative; z-index: 1;
    animation: loginFloat 4.6s ease-in-out infinite;
    filter: drop-shadow(0 16px 40px rgba(0,0,0,.22));
  }
  .app-icon-ring {
    position: absolute; inset: -10px; border-radius: 34px;
    border: 2px solid rgba(255,255,255,.45);
    animation: loginRing 2.8s ease-out infinite;
  }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 28px; }
  .login-hero h1 { margin: 0; font-size: 42px; position: relative; z-index: 1; animation: loginFadeUp .8s .15s both; }
  .login-hero p { opacity: .92; max-width: 280px; line-height: 1.7; position: relative; z-index: 1; animation: loginFadeUp .8s .28s both; }
  .login-hero small { position: absolute; bottom: 24px; opacity: .8; font-size: 12px; }
  @keyframes loginAurora { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(-4%,3%,0) scale(1.08); } }
  @keyframes loginCardIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes loginHeroShift { from { background-position: 0% 20%; } to { background-position: 80% 80%; } }
  @keyframes loginOrb { 0%,100% { transform: translate(0,0) scale(1); opacity: .55; } 50% { transform: translate(18px,-22px) scale(1.12); opacity: .9; } }
  @keyframes loginDash { to { stroke-dashoffset: -220; } }
  @keyframes loginPacket { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  @keyframes loginMark { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(-16deg) translate(12px,-10px); } }
  @keyframes loginFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes loginRing { 0% { transform: scale(.92); opacity: .7; } 100% { transform: scale(1.18); opacity: 0; } }
  @keyframes loginFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes loginShine { 0%,55% { transform: translateX(120%); } 75%,100% { transform: translateX(-120%); } }
  @media (max-width: 860px) {
    .login-card { grid-template-columns: 1fr; min-height: auto; }
    .login-hero { min-height: 280px; padding: 2.4rem 1.5rem 3.2rem; }
    .login-form { padding: 2rem 1.4rem 2.2rem; }
    .login-route, .login-mark { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-aurora" aria-hidden="true"></div>
  <div class="login-card">
    <form class="login-form" onsubmit="return false">
      <p class="login-kicker">KEVA Admin</p>
      <h2>لوحة التحكم</h2>
      <p class="sub">سجّل دخولك إلى لوحة التحكم الإدارية العامة</p>
      <label class="field-label">البريد الإلكتروني
        <span class="field-wrap"><input class="input" type="email" value="admin@keva.com"></span>
      </label>
      <label class="field-label">كلمة المرور
        <span class="field-wrap"><input class="input" type="password"></span>
      </label>
      <div class="login-meta">
        <label class="check"><input type="checkbox" checked> تذكرني على هذا الجهاز</label>
        <span class="forgot">نسيت كلمة المرور؟</span>
      </div>
      <div class="verify-seal" role="status">
        <span class="verify-stamp">رمز التحقق</span>
        <code class="verify-code">24dae91c8720a3768ab11615be7cdc0c0a3c1d6c7e04323f1dde9afdd2d1e649</code>
      </div>
      <button class="login-submit" type="submit">تسجيل الدخول</button>
      <p class="secure-note">اتصال آمن مشفر بالكامل</p>
    </form>
    <div class="login-hero">
      <div class="login-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
      <svg class="login-route" viewBox="0 0 320 420" aria-hidden="true">
        <path d="M40 80 C 90 140, 230 90, 270 180 S 80 280, 60 360"></path>
        <circle class="login-packet" r="6"></circle>
      </svg>
      <svg class="login-mark" width="280" height="280" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M10 50 32 14 54 50" stroke="currentColor" stroke-width="8.5"></path>
        <path d="M18 50 32 28" stroke="currentColor" stroke-width="5"></path>
      </svg>
      <div class="app-icon">
        <span class="app-icon-ring"></span>
        <img src="keva-icon.png" alt="KEVA">
      </div>
      <h1>KEVA</h1>
      <p>نظام إدارة وتوصيل لوجستي متكامل للمؤسسات الضخمة</p>
      <small>كيفا لوجستكس © جميع الحقوق محفوظة</small>
    </div>
  </div>
</div>
</body>
</html>
