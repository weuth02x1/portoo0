<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="domain-verification" content="24dae91c8720a3768ab11615be7cdc0c0a3c1d6c7e04323f1dde9afdd2d1e649">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVA — لوحة التحكم</title>
<link rel="icon" type="image/png" href="keva-icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1a1228; }
  .login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: min(1180px, 100%);
    min-height: calc(100vh - 48px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-radius: 28px;
    overflow: hidden;
  }
  .login-form { padding: 3rem 3.2rem; display: flex; flex-direction: column; justify-content: center; }
  .login-form h2 { margin: 0 0 8px; font-size: 28px; color: #1e1b4b; }
  .sub { color: #9a8fa8; margin: 0 0 28px; }
  .field-label { display: flex; flex-direction: column; gap: 8px; font-weight: 700; font-size: 13px; margin-bottom: 14px; }
  .input {
    width: 100%; height: 52px; border: 1px solid #eeeaf3; border-radius: 14px;
    padding: 0 16px; background: #faf8fc; font-size: 15px;
  }
  .login-submit {
    height: 54px; border: 0; border-radius: 16px; margin-top: 8px; color: #fff;
    font-weight: 800; cursor: pointer; background: linear-gradient(90deg, #f472b6, #7c3aed);
  }
  .secure-note { text-align: center; color: #16a34a; font-size: 12px; margin-top: 18px; }
  .login-hero {
    background: linear-gradient(165deg, #f472b6 0%, #c026d3 38%, #7c3aed 100%);
    color: #fff; padding: 3rem 2.5rem; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .app-icon { width: 92px; height: 92px; border-radius: 28px; overflow: hidden; margin-bottom: 22px; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .login-hero h1 { margin: 0; font-size: 42px; }
  .login-hero p { opacity: .92; max-width: 280px; line-height: 1.7; }
  .login-hero small { opacity: .8; font-size: 12px; }
  @media (max-width: 800px) { .login-card { grid-template-columns: 1fr; } .login-hero { min-height: 280px; } }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <form class="login-form" onsubmit="return false">
      <h2>لوحة التحكم</h2>
      <p class="sub">سجّل دخولك إلى لوحة التحكم الإدارية العامة</p>
      <label class="field-label">البريد الإلكتروني
        <input class="input" type="email" value="admin@keva.com">
      </label>
      <label class="field-label">كلمة المرور
        <input class="input" type="password">
      </label>
      <button class="login-submit" type="submit">تسجيل الدخول</button>
      <p class="secure-note">اتصال آمن مشفر بالكامل</p>
    </form>
    <div class="login-hero">
      <div class="app-icon"><img src="keva-icon.png" alt="KEVA"></div>
      <h1>KEVA</h1>
      <p>نظام إدارة وتوصيل لوجستي متكامل للمؤسسات الضخمة</p>
      <small>كيفا لوجستكس © جميع الحقوق محفوظة</small>
    </div>
  </div>
</div>
</body>
</html>
